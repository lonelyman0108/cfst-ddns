name: Build and Release

# 发布流程：合并到 main → release-please 维护 Release PR（CHANGELOG + 版本号）
#          → 合并 Release PR → 打 tag 并创建 Release → 本工作流构建二进制与镜像并上传
on:
  push:
    branches: [main]
    tags: ['v*']   # 兜底：手动推 tag 也能完整发布
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/SETUP.md']
  workflow_dispatch:

# 仅 PR 有新提交时取消旧运行；main 与 tag 上的运行可能正在发版，不能取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKER_IMAGE: lonelyman0108/cfst-ddns

jobs:
  # 维护 Release PR；合并 Release PR 时打 tag 并创建 GitHub Release
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  # 前端构建 + 后端测试，所有触发都会运行
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet & test
        run: |
          go vet ./...
          go test -race ./...

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # 多平台二进制：发版或手动触发
  binaries:
    needs: [test, release-please]
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
       startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Cross compile
        run: |
          VERSION="${TAG:-dev-${GITHUB_SHA::7}}"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/armv7 linux/armv6 linux/386 linux/mips linux/mipsle \
                        linux/mips64 linux/mips64le windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"; goarm=""
            if [[ "$arch" == armv* ]]; then goarm="${arch#armv}"; goarch=arm; else goarch="$arch"; fi
            name="cfst-ddns_${VERSION}_${os}_${arch}"
            bin="cfst-ddns"; [[ "$os" == windows ]] && bin="cfst-ddns.exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$goarch GOARM=$goarm GOMIPS=softfloat \
              go build -trimpath -ldflags "$LDFLAGS" -o "build/$name/$bin" ./cmd/cfst-ddns
            cp README.md "build/$name/"
            if [[ "$os" == windows ]]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  # Docker 镜像（standard + bundled）：发版或手动触发
  docker:
    needs: [test, release-please]
    if: >-
      !cancelled() && needs.test.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
       startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build args
        id: args
        run: |
          VERSION="${TAG:-dev-${GITHUB_SHA::7}}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Metadata (standard)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            # 仅发版时生成 latest
            type=raw,value=latest,enable=${{ env.TAG != '' }}
            # 手动触发时使用 dev 标签与 commit SHA 短标签
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=dev-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Metadata (bundled)
        id: meta-bundled
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }},suffix=-bundled
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},suffix=-bundled
            type=semver,pattern={{major}},value=${{ env.TAG }},suffix=-bundled
            type=raw,value=latest-bundled,enable=${{ env.TAG != '' }}
            type=raw,value=dev-bundled,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=dev-bundled-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push (standard)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: standard
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.args.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.args.outputs.time }}
          cache-from: type=gha,scope=standard
          cache-to: type=gha,mode=max,scope=standard

      - name: Build and push (bundled)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: bundled
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta-bundled.outputs.tags }}
          labels: ${{ steps.meta-bundled.outputs.labels }}
          build-args: |
            VERSION=${{ steps.args.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.args.outputs.time }}
          cache-from: type=gha,scope=bundled
          cache-to: type=gha,mode=max,scope=bundled

  # 把二进制上传到 release-please 创建的 Release（手动推 tag 时先创建 Release）
  release:
    needs: [release-please, binaries, docker]
    if: >-
      !cancelled() && needs.binaries.result == 'success' && needs.docker.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Upload assets
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" dist/* --clobber

      - name: Append Docker usage
        run: |
          V="${TAG#v}"
          {
            gh release view "$TAG" --json body -q .body
            echo
            echo "## Docker"
            echo
            echo '```bash'
            echo "docker pull ${DOCKER_IMAGE}:${V}"
            echo "docker pull ${DOCKER_IMAGE}:${V}-bundled   # 预置 cfst"
            echo '```'
          } > notes.md
          grep -q '^## Docker' <(gh release view "$TAG" --json body -q .body) || gh release edit "$TAG" --notes-file notes.md
