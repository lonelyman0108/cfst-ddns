services:
  cfst-ddns:
    # 预置 cfst 的离线版本：lonelyman0108/cfst-ddns:latest-bundled
    image: lonelyman0108/cfst-ddns:latest
    # 从源码构建：注释上面的 image，取消下面两行的注释
    # build: .
    # image: cfst-ddns:local
    container_name: cfst-ddns
    restart: unless-stopped

    # 测速需要直接使用宿主机网络，否则延迟/速度会被 Docker 网络转发影响。
    # 注意：Docker Desktop（Windows/macOS）不支持 host 网络，测速结果会失真。
    network_mode: host

    environment:
      - TZ=Asia/Shanghai
      # Web 界面监听地址（host 网络下即宿主机端口）
      - CFST_DDNS_LISTEN=:8080
      # 可选：首次启动时自动创建管理员（也可在网页中创建）
      # - ADMIN_USERNAME=admin
      # - ADMIN_PASSWORD=change-me
      # 可选：配置加密密钥；不设置则自动生成 data/secret.key（请随数据一起备份）
      # - CFST_DDNS_SECRET=

    volumes:
      - ./data:/app/data

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
